<html lang="pt-BR">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plano de Concursos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style id="css">
:root{
  --bg:#F3F6F5;--surface:#FFFFFF;--ink:#14211F;--muted:#5A6966;--line:#D6DEDB;
  --accent:#1F6F5C;--accent-soft:#E1EFEA;--amber:#B87A12;--amber-soft:#F6ECD9;
  --ti:#1F6F5C;--port:#3B5BA5;--adm:#9A4B2F;--rlm:#7A5AA6;--eco:#8A6A12;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Source Sans 3",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1614;--surface:#15201D;--ink:#E3ECE9;--muted:#9AABA6;--line:#26332F;
    --accent:#52B596;--accent-soft:#1A332C;--amber:#E2AA4A;--amber-soft:#33291A;
    --ti:#52B596;--port:#8AA5E8;--adm:#E0936F;--rlm:#B99BE3;--eco:#D9B45A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1614;--surface:#15201D;--ink:#E3ECE9;--muted:#9AABA6;--line:#26332F;
  --accent:#52B596;--accent-soft:#1A332C;--amber:#E2AA4A;--amber-soft:#33291A;
  --ti:#52B596;--port:#8AA5E8;--adm:#E0936F;--rlm:#B99BE3;--eco:#D9B45A;
}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:28px 56px;display:grid;gap:24px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;border-bottom:1px solid var(--line);padding-bottom:12px}
.tab{font-family:var(--body);font-size:15px;font-weight:600;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;display:grid;gap:0;text-align:left;line-height:1.25}
.tab small{font-weight:400;font-size:12px}
.tab .tp{font-family:var(--mono);font-size:11px;font-weight:700}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:grid;gap:10px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,44px);line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.01em}
.lede{max-width:66ch;color:var(--muted);margin:0}
.top{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
@media (max-width:760px){.top{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:grid;gap:12px;align-content:start;min-width:0}
.panel h2{font-family:var(--display);font-weight:600;font-size:18px;margin:0}
.panel p{margin:0}
.weights{display:grid;gap:8px}
.wrow{display:grid;grid-template-columns:minmax(120px,190px) 1fr 38px;align-items:center;gap:10px;font-size:14px}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:5px}
.num{font-family:var(--mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.progress-big{display:flex;align-items:baseline;gap:10px}
.progress-big b{font-family:var(--mono);font-size:40px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.progress-big small{color:var(--muted)}
.pbar{height:12px;background:var(--accent-soft);border-radius:6px;overflow:hidden}
.pbar span{display:block;height:100%;background:var(--accent);transition:width .3s}
.status{font-size:13px;color:var(--muted);min-height:1.2em}
.routine{font-size:14px;margin:0;padding-left:18px;display:grid;gap:4px}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.c-ti{color:var(--ti)}.c-port{color:var(--port)}.c-adm{color:var(--adm)}.c-rlm{color:var(--rlm)}.c-sim{color:var(--amber)}.c-eco{color:var(--eco)}
.facts{display:grid;gap:8px;margin:0}
.facts div{display:grid;grid-template-columns:110px 1fr;gap:10px;font-size:14px}
.facts dt{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.facts dd{margin:0}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.money{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.target td:first-child{font-weight:700}
.pill{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.05em;padding:1px 6px;border-radius:3px;background:var(--accent);color:var(--surface);margin-left:6px;vertical-align:1px}
.weeks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.weeks{grid-template-columns:1fr}}
.week{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:10px;align-content:start}
.week.done{border-color:var(--accent)}
.whead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.wnum{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.wtitle{font-family:var(--display);font-weight:600;font-size:19px;margin:2px 0 0;line-height:1.2}
.wcount{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.week.done .wcount{color:var(--accent);font-weight:700}
ul.items{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.items label{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:start;cursor:pointer;padding:6px 8px;border-radius:6px}
.items label:hover{background:var(--accent-soft)}
.items input{width:17px;height:17px;margin:3px 0 0;accent-color:var(--accent);cursor:pointer}
.items input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.itext{display:grid;gap:3px}
.itext .t{font-size:15px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.also{font-family:var(--mono);font-size:11px;color:var(--muted)}
.items input:checked + .itext .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.note{background:var(--amber-soft);border:1px solid var(--line);border-radius:10px;padding:16px 20px;display:grid;gap:8px}
.note h2{font-family:var(--display);font-weight:600;font-size:18px;margin:0}
.note p{margin:0;max-width:75ch}
.links{display:grid;gap:6px;margin:0;padding-left:18px}
a{color:var(--accent)}
@media (prefers-reduced-motion:reduce){.pbar span{transition:none}}
</style>
</head>

function facts(rows){return '<dl class="facts">'+rows.map(function(r){return '<div><dt>'+r[0]+'</dt><dd>'+r[1]+'</dd></div>';}).join("")+'</dl>';}
function table(head,rows){return '<div class="tscroll"><table><thead><tr>'+head.map(function(x){return '<th>'+x+'</th>';}).join("")+'</tr></thead><tbody>'+rows.join("")+'</tbody></table></div>';}
function linkNote(title,links,p){return '<section class="note"><h2>'+title+'</h2><ul class="links">'+links.map(function(l){return '<li><a href="'+l[0]+'" target="_blank" rel="noopener">'+l[1]+'</a></li>';}).join("")+'</ul>'+(p?'<p>'+p+'</p>':'')+'</section>';}
function viewUFBA(tab){
  return '<header><div class="eyebrow">Concurso UFBA · Técnico de Tecnologia da Informação · nível D</div><h1>Plano de estudos: 12 semanas</h1>'+
  '<p class="lede">Baseado no último edital da UFBA (2022) e na prova de Técnico de TI de 2016. Banca nova: Instituto Avalia. 20 vagas de Técnico de TI. Vencimento inicial de R$ 3.181,39 + auxílio-alimentação de R$ 1.192.</p></header>'+
  '<div class="top"><section class="panel"><h2>Peso de cada disciplina na prova</h2><div class="weights">'+
  wrow("Conhecimentos de TI",50,50,"var(--ti)")+wrow("Português",20,50,"var(--port)")+wrow("Administração Pública",20,50,"var(--adm)")+wrow("Raciocínio Lógico",10,50,"var(--rlm)")+
  '</div><h2>Rotina sugerida (~12h por semana)</h2><ul class="routine"><li>Seg a sex: 1h30 de TI + 30 min de Português, Adm. ou RLM</li><li>Sábado: 2h de questões da semana</li><li>Domingo: descanso ou atraso</li></ul></section>'+progressPanel(tab)+'</div>'+
  groupsHTML(tab)+
  linkNote("Material de apoio",[["https://concursos.ufba.br/sites/concursos.ufba.br/files/tecnicos/edital_no_05-2022_retificado_em_05.07.2023.pdf","Edital UFBA 005/2022 (referência de conteúdo)"],["https://concursos.ufba.br/sites/concursos.ufba.br/files/tecnicos/prova_tecnico_de_tecnologia_da_informacao.pdf","Prova anterior de Técnico de TI da UFBA"],["https://concursos.ufba.br/concursos-anteriores-tecnicos","Concursos anteriores de técnicos da UFBA"]],"Para questões, filtre por cargo \"Técnico de Tecnologia da Informação\" em universidades federais num banco de questões.");}
function viewBacen(tab){
  return '<header><div class="eyebrow">Banco Central do Brasil · 170 vagas autorizadas</div><h1>Bacen: edital até janeiro de 2027</h1>'+
  '<p class="lede">O cargo de Técnico exige só ensino médio e paga cerca de R$ 8 mil, mas não é de TI: é apoio técnico e administrativo geral. A última prova foi de Analista, em 2024, pela Cebraspe (certo/errado). Os temas abaixo são uma estimativa até o edital sair.</p></header>'+
  '<div class="top"><section class="panel"><h2>Situação</h2>'+facts([["Autorização","170 vagas autorizadas"],["Banca","Em contratação, prazo até 16/10/2026"],["Edital","Até 03/01/2027"],["Prova","Prevista para março de 2027"]])+
  '<h2>Cargos</h2>'+table(["Cargo","Vagas","Requisito","Inicial"],[
   '<tr class="target"><td>Técnico<span class="pill">SEU ALVO</span></td><td>50</td><td>Ensino médio</td><td class="money">≈ R$ 7,9–8,3 mil</td></tr>',
   '<tr><td>Auditor (antigo Analista)</td><td>100</td><td>Superior em qualquer área</td><td class="money">R$ 20.924,80</td></tr>',
   '<tr><td>Procurador</td><td>20</td><td>Direito + OAB</td><td class="money">R$ 22.905,79</td></tr>'])+
  '<p style="font-size:13px;color:var(--muted)">Em 2024, o Analista teve área de TI com 70 itens específicos (engenharia de software, infraestrutura, ciência de dados, segurança). Vale quando você tiver o diploma.</p></section>'+progressPanel(tab)+'</div>'+
  groupsHTML(tab)+
  linkNote("Fontes",[["https://www.estrategiaconcursos.com.br/blog/concurso-bacen/","Estratégia Concursos: Concurso Bacen"],["https://blog.grancursosonline.com.br/concurso-bacen/","Gran: 170 vagas autorizadas"],["https://www.cebraspe.org.br/concursos/bcb_24","Cebraspe: concurso Bacen 2024"]],"Português, lógica e direito administrativo se repetem na UFBA, então o estudo de lá já adianta uma parte daqui.");}
function viewBNB(tab){
  return '<header><div class="eyebrow">Banco do Nordeste · edital em estudo</div><h1>BNB: cadastro zerado, novo edital cobrado</h1>'+
  '<p class="lede">O cadastro de reserva do concurso de 2024 foi zerado e o banco está sondando bancas (Cesgranrio, Cebraspe e FGV). A previsão é de cerca de 500 vagas de Analista Bancário, de nível médio. Ainda não há data.</p></header>'+
  '<div class="top"><section class="panel"><h2>Situação</h2>'+facts([["Banca","Não definida (Cesgranrio, Cebraspe ou FGV)"],["Edital","Em estudo, sem data"],["Última prova","2024, Cesgranrio: 60 questões em 4h"]])+
  '<h2>Peso na prova de 2024 (Analista Bancário)</h2><div class="weights">'+wrow("Conhecimentos bancários",40,40,"var(--eco)")+wrow("Português",10,40,"var(--port)")+wrow("Matemática",10,40,"var(--rlm)")+'</div>'+
  '<h2>Cargos</h2>'+table(["Cargo","Vagas","Requisito","Inicial"],[
   '<tr class="target"><td>Analista Bancário I<span class="pill">SEU ALVO</span></td><td>≈ 500 (previsão)</td><td>Ensino médio</td><td class="money">R$ 3.788,16 + benefícios</td></tr>',
   '<tr><td>Especialista Técnico em TI</td><td>90 (citado)</td><td>Superior em TI</td><td class="money">R$ 6.556,92; R$ 10.099,82 após 3 meses</td></tr>'])+
  '</section>'+progressPanel(tab)+'</div>'+
  groupsHTML(tab)+
  linkNote("Fontes",[["https://www.estrategiaconcursos.com.br/blog/concurso-bnb/","Estratégia Concursos: Concurso BNB"],["https://www.editorasolucao.com.br/blog/concurso/bnb","Editora Solução: Concurso BNB"]],"As vagas são para cidades da área de atuação do banco, principalmente no Nordeste. Confira a lotação no edital.");}
function render(){
  var tab=TABS.filter(function(t){return t.id===cur;})[0];
  var h='<div class="wrap"><nav class="tabs" role="tablist" aria-label="Concursos">';
  TABS.forEach(function(t){var s=stats(t);h+='<button class="tab" role="tab" data-tab="'+t.id+'" aria-selected="'+(t.id===cur)+'">'+t.label+'<small>'+t.sub+' · <span class="tp">'+s.p+'%</span></small></button>';});
  h+='</nav>';
  h+=(cur==="bacen"?viewBacen(tab):cur==="bnb"?viewBNB(tab):viewUFBA(tab));
  h+='</div>';
  document.getElementById("app").innerHTML=h;
}
function setStatus(m){statusMsg=m;var el=document.getElementById("status");if(el)el.textContent=m;}
function localSave(){try{localStorage.setItem("ufba-plano-done",JSON.stringify(Array.from(done)));}catch(e){}}
function buildDoc(){
  var css=document.getElementById("css").textContent;
  var js=document.getElementById("app-js").textContent;
  var json=JSON.stringify({done:Array.from(done)}).replace(/</g,"\\u003c");
  return '<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Plano de Concursos</title>'+
  '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">'+
  '<style id="css">'+css+'<\/style></head><body><div id="app"></div><script type="application/json" id="state">'+json+'<\/script><script id="app-js">'+js+'<\/script></body></html>';
}
function schedule(){
  if(mode!=="artifact"){localSave();return;}
  setStatus("Salvando…");
  clearTimeout(timer);
  timer=setTimeout(function(){
    artifactNs.publish(buildDoc()).then(function(){setStatus("Progresso salvo");},function(err){
      var code=err&&err.code;
      if(code==="conflict")return;
      if(code==="not_granted"||code==="not_writer"){mode="local";localSave();setStatus("Sem permissão para salvar na página. Progresso guardado só neste navegador.");return;}
      setStatus("Não foi possível salvar agora. Marque de novo em instantes.");
    });
  },1500);
}
document.addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest("[data-tab]");if(!b)return;
  cur=b.getAttribute("data-tab");
  try{localStorage.setItem("plano-tab",cur);}catch(err){}
  render();
  var nb=document.querySelector('[data-tab="'+cur+'"]');if(nb)nb.focus();
});
document.addEventListener("change",function(e){
  var t=e.target;if(!t||!t.dataset||!t.dataset.id)return;
  ITEMS[t.dataset.id].keys.forEach(function(k){if(t.checked)done.add(k);else done.delete(k);});
  var y=window.scrollY;render();window.scrollTo(0,y);
  var el=document.getElementById("t"+t.dataset.id);if(el)el.focus({preventScroll:true});
  schedule();
});
render();
var use=window.claude&&window.claude.use;
(use?window.claude.use("artifact"):Promise.resolve(null)).then(function(ns){
  if(ns){artifactNs=ns;mode="artifact";setStatus("Marque as tarefas: o progresso fica salvo na página.");}
  else{mode="local";
    try{var s=JSON.parse(localStorage.getItem("ufba-plano-done")||"[]");s.forEach(function(x){done.add(x);});}catch(e){}
    statusMsg="Progresso guardado neste navegador.";render();}
},function(){mode="local";});
})();
</script>

</body>
</html>
